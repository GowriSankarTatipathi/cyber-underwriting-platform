name: Django pilot checks
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: cyber, POSTGRES_PASSWORD: test-only-password, POSTGRES_DB: cyber_underwriting}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cyber" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production-01234567890123456789
      DJANGO_DEBUG: "true"
      LOCAL_PASSWORD_ONLY: "false"
      DB_NAME: cyber_underwriting
      DB_USER: cyber
      DB_PASSWORD: test-only-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      AI_RUN_QUEUE_TEST: "1"
      RECOVERY_RUN_TEST: "1"
      MONITORING_LIVE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - name: Install OCR and PostgreSQL 17 recovery clients
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          gpg --show-keys --with-colons /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc | grep -q B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - run: python -m pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test workspaces evidence underwriting ai_review operations monitoring portfolio --noinput
      - name: Validate disposable deployment configuration
        run: |
          python deploy/ci_config.py
          python deploy/preflight.py
          docker compose --env-file .env.staging -f deploy/compose.yaml config --quiet
      - name: Build and check the staging image without deploying
        run: |
          docker build -f deploy/Dockerfile -t cyber-underwriting:ci .
          docker run --rm --env-file .env.staging -e DJANGO_DEBUG=false --entrypoint python cyber-underwriting:ci manage.py check --deploy --fail-level WARNING
          docker run --rm --env-file .env.staging -e DJANGO_DEBUG=false -e EVIDENCE_STORAGE_BACKEND=s3 -e EVIDENCE_SCAN_MODE=external -e 'EVIDENCE_SCAN_COMMAND=["clamscan","--no-summary"]' -e AI_REVIEW_PROVIDER=off --entrypoint python cyber-underwriting:ci manage.py check_staging
