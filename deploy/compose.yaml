name: cyber-underwriting-staging
x-app: &app
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  env_file: ../.env.staging
  environment:
    DJANGO_DEBUG: "false"
    DJANGO_TRUST_PROXY: "true"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USER: cyber
    DB_NAME: cyber_underwriting
    CELERY_BROKER_URL: redis://redis:6379/0
    EVIDENCE_STORAGE_BACKEND: s3
    EVIDENCE_SCAN_MODE: external
    EVIDENCE_SCAN_COMMAND: '["clamscan","--no-summary"]'
    AI_REVIEW_PROVIDER: "${STAGING_AI_PROVIDER:-off}"
  volumes:
    - app-private:/app/.local
    - static:/app/staticfiles
    - antivirus:/var/lib/clamav:ro
  networks: [backend, egress]
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:17-bookworm
    env_file: ../.env.staging
    environment:
      POSTGRES_DB: cyber_underwriting
      POSTGRES_USER: postgres
    volumes:
      - database:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d cyber_underwriting"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [broker:/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  antivirus-update:
    build: {context: .., dockerfile: deploy/Dockerfile}
    user: root
    command: [sh, -c, "chown clamav:clamav /var/lib/clamav && exec freshclam --foreground=true --daemon --checks=12"]
    volumes: [antivirus:/var/lib/clamav]
    networks: [egress]
    restart: unless-stopped
  init:
    <<: *app
    command: [python, deploy/initialize.py]
    restart: "no"
  web:
    <<: *app
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    <<: *app
    command: [celery, -A, pilot, worker, --concurrency=2, --loglevel=WARNING]
    depends_on:
      init: {condition: service_completed_successfully}
  beat:
    <<: *app
    command: [celery, -A, pilot, beat, --schedule=/app/.local/celerybeat-schedule, --loglevel=WARNING]
    depends_on:
      init: {condition: service_completed_successfully}
  edge:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8443:443"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../.local/staging/tls:/etc/nginx/tls:ro
      - static:/srv/static:ro
    networks: [backend]
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

networks:
  backend: {internal: true}
  egress: {}
volumes:
  database: {}
  broker: {}
  app-private: {}
  static: {}
  antivirus: {}
