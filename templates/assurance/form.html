{% extends 'assurance/layout.html' %}{% block assessment_content %}
<section class="panel form-panel"><h2>{{ title }}</h2><p>{{ intro }}</p>
{% if form.errors %}<div class="notice message error" role="alert">Please correct the errors below. Nothing has been saved.</div>{% endif %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="button">Save and review</button> <a href="{% url 'assessment_section' case.pk section %}">Cancel</a></form></section>
{% endblock %}
