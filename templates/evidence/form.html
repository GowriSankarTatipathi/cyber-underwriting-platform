{% extends 'workspaces/base.html' %}
{% block content %}<a class="back" href="{% if item %}{% url 'evidence_request' case.pk item.pk %}{% else %}{% url 'case' case.pk %}{% endif %}">← Back to case</a><p class="eyebrow">{{ case.reference }} / EVIDENCE & RECOVERY</p><h1>{{ title }}</h1><p class="muted">{{ intro }}</p><section class="panel form-panel"><form method="post" {% if upload %}enctype="multipart/form-data"{% endif %}>{% csrf_token %}{{ form.as_p }}<button class="button">{{ button }}</button></form></section>{% endblock %}
